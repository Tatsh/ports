ci:
  skip:
    - 'check-formatting-markdown'
    - 'check-formatting-prettier'
    - 'cspell'
repos:
  - hooks:
      - id: 'check-added-large-files'
      - id: 'check-case-conflict'
      - id: 'check-executables-have-shebangs'
      - id: 'check-json'
      - id: 'check-merge-conflict'
      # Port payload scripts are run by the Portfile (for example `expect ${filespath}/x.exp`).
      - exclude: '/files/'
        id: 'check-shebang-scripts-are-executable'
      - id: 'check-symlinks'
      - id: 'check-toml'
      - id: 'check-yaml'
      - id: 'detect-private-key'
      # Patch files must keep their whitespace exactly or they no longer apply.
      - exclude: '\.diff$'
        id: 'end-of-file-fixer'
      - exclude: '\.diff$'
        id: 'mixed-line-ending'
      - exclude: '\.diff$'
        id: 'trailing-whitespace'
    repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: 'v6.0.0'
  - hooks:
      # Match `ruff check .`, which does not lint the scripts without a suffix in _resources/bin.
      - files: '\.pyi?$'
        id: 'ruff-check'
    repo: 'https://github.com/astral-sh/ruff-pre-commit'
    rev: 'v0.16.9'
  - hooks:
      - files: '\.pyi?$'
        id: 'isort'
    repo: 'https://github.com/PyCQA/isort'
    rev: '6.1.0'
  - hooks:
      - files: '\.pyi?$'
        id: 'yapf'
        name: 'check Python files are formatted'
    repo: 'https://github.com/google/yapf'
    rev: 'v0.43.0'
  - hooks:
      - additional_dependencies:
          - 'types-requests'
        files: '^_resources/bin/(.+2port|liveupdate)$'
        id: 'mypy'
    repo: 'https://github.com/pre-commit/mirrors-mypy'
    rev: 'v1.19.1'
  - hooks:
      - id: 'check-github-workflows'
    repo: 'https://github.com/python-jsonschema/check-jsonschema'
    rev: '0.38.2'
  - hooks:
      - id: 'zizmor'
    repo: 'https://github.com/zizmorcore/zizmor-pre-commit'
    rev: 'v1.30.1'
  - hooks:
      - id: 'cspell'
    repo: 'https://github.com/streetsidesoftware/cspell-cli'
    rev: 'v10.2.0'
  - hooks:
      - entry: 'yarn prettier -c'
        id: 'check-formatting-prettier'
        language: 'system'
        name: 'check files are formatted with Prettier'
        types_or:
          - 'json'
          - 'markdown'
          - 'toml'
          - 'yaml'
      - entry: "yarn markdownlint-cli2 '#node_modules'"
        id: 'check-formatting-markdown'
        language: 'system'
        name: 'check Markdown files are formatted'
        types:
          - 'markdown'
    repo: 'local'
